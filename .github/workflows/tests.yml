name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GPy >=1.15 requires Python >=3.11.5
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install runtime + test deps explicitly: editable metadata from
          # setup.py is not reliably applied by current pip/setuptools.
          python -m pip install "numpy>=1.7" "scipy>=0.12" "GPy>=1.15" matplotlib h5py tables "coverage>=7.0"
          python -m pip install -e . --no-deps

      - name: Run unit tests with coverage
        run: |
          python -m coverage run -m unittest discover -s deepgp/testing -p 'test*.py' -v
          # Gate is on the maintained serial DeepGP surface (.coveragerc omits).
          python -m coverage report --fail-under=60

      - name: Upload coverage XML
        if: always()
        run: python -m coverage xml -o coverage.xml

  # CIP-0001 R11: optional MPI parity while mpi4py support still exists.
  mpi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MPI and Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenmpi-dev openmpi-bin
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "numpy>=1.7" "scipy>=0.12" "GPy>=1.15" matplotlib h5py tables mpi4py
          python -m pip install -e . --no-deps

      - name: MPI parity (2 ranks vs serial)
        env:
          OMPI_MCA_btl_vader_single_copy_mechanism: none
          OMPI_MCA_rmaps_base_oversubscribe: 'true'
        run: mpiexec -n 2 python -m deepgp.testing.mpi_parity
