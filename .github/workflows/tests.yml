name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install runtime + test deps explicitly: editable metadata from
          # setup.py is not reliably applied by current pip/setuptools.
          python -m pip install "numpy>=1.7" "scipy>=0.12" "GPy>=1.0" matplotlib h5py tables
          python -m pip install -e . --no-deps

      - name: Run unit tests
        run: python -m unittest deepgp.testing.model_tests_basic -v
